# CI — corre en cada push y PR. Render despliega `main` automáticamente: esto es lo
# único que se interpone entre un commit roto y producción.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: Backend (tests + guardianes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # El cliente de Prisma se genera desde el schema; no necesita base de datos.
      - run: npx prisma generate
      - run: npm run test:offline
        env:
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline?connect_timeout=1
          OPENROUTER_API_KEY: ''
          MISTRAL_API_KEY: ''

  web:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs

  postgres:
    name: CRM (PostgreSQL + HTTP + migraciones)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: crm_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:db
        env:
          CRM_TEST_DATABASE_URL: postgresql://crm_test:crm_test@127.0.0.1:5432/postgres
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline
          OPENROUTER_API_KEY: ''
          MISTRAL_API_KEY: ''
      # Hito A (entrada/salida durables + estado comercial) contra PostgreSQL real: la
      # durabilidad no se prueba con mocks, se prueba con índices, FKs y reclamos reales.
      - run: npm run test:db:hitoa
        env:
          CRM_TEST_DATABASE_URL: postgresql://crm_test:crm_test@127.0.0.1:5432/postgres
          RUN_POSTGRES_TESTS: '1'
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline
          OPENROUTER_API_KEY: ''
          MISTRAL_API_KEY: ''
      # Recorrido completo del CRM contra el servidor real y un proveedor de Meta ficticio en
      # localhost: webhook, campaña, envío, rechazo, incierto y aislamiento entre empresas.
      - run: npm run recorrido
        env:
          CRM_TEST_DATABASE_URL: postgresql://crm_test:crm_test@127.0.0.1:5432/postgres
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline
          OPENROUTER_API_KEY: ''
          MISTRAL_API_KEY: ''
      # Ensayo de publicacion: levanta el esquema ANTERIOR (20261001, el que corre en
      # produccion), lo puebla con historia parecida a la real, aplica la migracion
      # aditiva y comprueba que no se pierde nada, que una segunda pasada no escribe,
      # que el aislamiento por empresa sigue limpio y que el codigo VIEJO sigue
      # funcionando contra el esquema NUEVO (sin esto no hay vuelta atras).
      - run: npm run migracion:ensayo
        env:
          CRM_TEST_DATABASE_URL: postgresql://crm_test:crm_test@127.0.0.1:5432/postgres
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline
          OPENROUTER_API_KEY: ''
          MISTRAL_API_KEY: ''
